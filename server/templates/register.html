{% extends "layout.html" %}

  {% block styles %}
     <link rel="stylesheet" href="../static/register.css">
  {% endblock %}

{% block content% }
  <div class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center font-display text-slate-900 dark:text-slate-100 selection:bg-primary/20">
    <div class="w-full max-w-[440px] px-6">
        <!-- Logo and Brand Section -->
        <div class="flex flex-col items-center mb-10">
          <div class="size-14 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary/20 mb-4">
              <span class="material-symbols-outlined !text-3xl">shield_lock</span>
          </div>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">VaultGuard</h1>
          <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Personal Password Manager</p>
        </div>
        <!-- Login Card -->
        <div class="bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 p-8 rounded-xl shadow-sm">
          <div class="mb-6 text-center">
              <h2 class="text-lg font-semibold">Welcome Back</h2>
              <p class="text-slate-500 dark:text-slate-400 text-sm">Enter your master password to unlock your vault.</p>
          </div>
          <form class="space-y-6" onsubmit="return false;">
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2" for="master-password">Master Password</label>
                <div class="relative group">
                    <input autofocus="" class="block w-full h-12 px-4 pr-12 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="master-password" name="master-password" placeholder="••••••••••••" type="password"/>
                    <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 flex items-center justify-center" type="button">
                    <span class="material-symbols-outlined !text-xl">visibility</span>
                    </button>
                </div>
              </div>
              <button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-semibold rounded-lg shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2 group" type="submit">
              <span>Unlock Vault</span>
              <span class="material-symbols-outlined !text-lg transition-transform group-hover:translate-x-0.5">lock_open</span>
              </button>
          </form>
        </div>
        <!-- Utility Links -->
        <div class="mt-8 text-center space-y-4">
          <a class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-primary dark:hover:text-primary transition-colors flex items-center justify-center gap-1" href="#">
          Forgot Master Password?
          </a>
          <div class="flex items-center justify-center gap-6 pt-4 border-t border-slate-200 dark:border-slate-800">
              <button class="flex items-center gap-2 text-xs font-medium text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
              <span class="material-symbols-outlined !text-base">settings</span>
              Settings
              </button>
              <button class="flex items-center gap-2 text-xs font-medium text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors">
              <span class="material-symbols-outlined !text-base">help_outline</span>
              Support
              </button>
          </div>
        </div>
        <!-- Visual Background Decoration (Subtle) -->
        <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40">
          <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
          <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
        </div>
    </div>
  </div>
{% endblock %}
