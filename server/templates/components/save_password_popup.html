
<div id="savePasswordPopup" class="absolute bg-white dark:bg-slate-900/95 border border-slate-200 dark:border-slate-800 p-8 rounded-xl shadow-sm w-1/3 z-40">
  <div class="mb-6 text-center"> 
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Save Password</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm">Please add account and username</p>
  </div>
  <form class="" action="/add_password" method="post">
      <div class="p-8">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2 " for="master-password">Password</label>
        <div class="relative group">
            <input id="popupPassword" autofocus="" class="block w-full h-12 px-4 pr-12 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" name="password" placeholder="••••••••••••" type="password"/>
            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 flex items-center justify-center" type="button">
            <span class="material-symbols-outlined !text-xl">visibility</span>
            </button>
        </div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2 mt-4" for="master-password">Account Name</label>
        <div class="relative group">
            <input id="popupAccountName" class="block w-full h-12 px-4 pr-12 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" name="account_name" placeholder="Google.com" type="text"/>
        </div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2 mt-4" for="master-password">Username</label>
        <div class="relative group">
            <input id="popupUsername" class="block w-full h-12 px-4 pr-12 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all"  name="my_username" placeholder="my_username" type="text"/>
        </div>
      </div>
      <div class="p-8">
        <button id="" class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-semibold rounded-lg shadow-md shadow-primary/20 transition-all flex items-center justify-center gap-2 group" type="submit">
          <span>Save to Vault</span>
          <span class="material-symbols-outlined !text-lg transition-transform group-hover:translate-x-0.5">lock_open</span>
        </button>
      </div>
  </form>
</div>
